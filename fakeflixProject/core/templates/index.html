{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>Fakeflix</title>
</head>

<body>
    <img id="bg-img" src=" https://lumiere-a.akamaihd.net/v1/images/p_disney_lilo_stitch_poster_teaser_v1_a3d5e52f.jpeg"
        alt="">
    <div id="main-container">

        <!-- navbar -->
        <nav class="main-nav">
            <!-- style to have distance from nav-list -->
            <a class="logo-text" href="/">Fakeflix</a>

            <ul id="nav-list">
                <li><a href="/">Home</a></li>
                <li><a href="">Login</a></li>
            </ul>
        </nav>


        <div class="top-container">
            <h1 class="logo-text">Fakeflix</h1>
        </div>
        <div class="bottom-container">

            <div class="film-row-container">
                <h4 class="film-row-header">Action Movies</h4>

                <div class="film-row">
                    {% for movie in action_movie_data %}
                    <img src="{{ movie.Poster }}" alt="{{ movie.Title }}">
                    {% endfor %}
                </div>

            </div>

            <div class="film-row-container">
                <h4 class="film-row-header">Scary Movies</h4>

                <div class="film-row">
                    {% for movie in scary_movie_data %}
                    <img src="{{ movie.Poster }}" alt="{{ movie.Title }}">
                    {% endfor %}
                </div>

            </div>

            <div class="film-row-container">
                <h4 class="film-row-header">Comedy Movies</h4>

                <div class="film-row">
                    {% for movie in comedy_movie_data %}
                    <img src="{{ movie.Poster }}" alt="{{ movie.Title }}">
                    {% endfor %}
                </div>

            </div>

        </div>

    </div>

</body>

</html>
