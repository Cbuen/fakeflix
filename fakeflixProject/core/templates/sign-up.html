{% extends "base.html" %}
{% block content %}
<div class="input-container">
    <form action="{% url 'create-account' %}" method="POST">
        {% csrf_token %}
        {{ form.as_p }} <!-- Let Django render the form fields -->
        <div class="button-container">
            <button type="submit">Sign Up</button>
        </div>
    </form>
</div>
{% endblock content %}
